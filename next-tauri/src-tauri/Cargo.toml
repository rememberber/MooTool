[package]
name = "mootool-next-tauri"
version = "0.1.0-rc.1"
description = "MooTool Next Tauri independent desktop product"
authors = ["Zhou Bo <rememberber@163.com>"]
license = "MIT"
repository = "https://github.com/rememberber/MooTool"
edition = "2024"
rust-version = "1.87"

[lib]
name = "mootool_next_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.0"
futures-util = "0.3.33"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "=3.6.3", features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
keepawake = "0.6.0"
mouse_position = "0.1.4"
notify = "8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream", "json", "form"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "backup"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36.1"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tempfile = "3"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "fs", "net", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vtracer = "=1.0.0-alpha.3"
xcap = "0.9.8"
