name: Next macOS Native
on:
  push:
    paths:
      - 'next-macos-native/**'
      - '.github/workflows/next-macos-native-build.yml'
    tags:
      - 'next-macos-native-v*'
  pull_request:
    paths:
      - 'next-macos-native/**'
      - '.github/workflows/next-macos-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: next-macos-native
    steps:
      - uses: actions/checkout@v4
      - name: Validate native product version
        env:
          NATIVE_REF_TYPE: ${{ github.ref_type }}
          NATIVE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid native VERSION'
          assert pathlib.Path(f'release-notes/{version}.md').is_file(), 'Missing native release notes'
          if os.environ['NATIVE_REF_TYPE'] == 'tag':
              assert os.environ['NATIVE_REF_NAME'] == f'next-macos-native-v{version}', 'Native tag/version mismatch'
          PY
      - name: Core checks
        run: ./scripts/check-core.sh
      - name: XCTest
        # Extra XCTest methods are not part of the 59-group check-core release gate.
        continue-on-error: true
        run: swift test
      - name: Build universal app and DMG
        run: ./scripts/build-app.sh --arch universal --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MooTool-Next-macOS-Native-universal
          path: |
            next-macos-native/dist/universal/*.dmg
            next-macos-native/dist/universal/build-info.json
          if-no-files-found: error

  release:
    name: GitHub Pre-release (not Latest)
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MooTool-Next-macOS-Native-universal
          path: release-assets
      - name: Create prerelease without changing repository Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < next-macos-native/VERSION)"
          notes="next-macos-native/release-notes/${version}.md"
          test -f "$notes"
          test "$RELEASE_TAG" = "next-macos-native-v${version}"
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/build-info.json)
          test "${#files[@]}" -ge 2
          dmg="release-assets/MooTool-Next-macOS-Native-${version}-mac-universal.dmg"
          test -s "$dmg"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading assets" >&2
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "MooTool Next macOS Native ${version}" \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi
          echo "::warning::Native macOS packages use ad-hoc signing without Apple notarization. Did not update update-manifest.json. make_latest is false."
