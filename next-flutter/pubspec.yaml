name: mootool_next_flutter
description: Independent MooTool Next Flutter desktop toolbox.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_selector: ^1.0.3
  gbk_codec: ^0.4.0
  image: ^4.5.4
  path: ^1.9.1
  pointycastle: ^3.9.1
  qr: ^3.0.2
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mootool-logo.png
    - assets/brand/wx-zanshang.jpg
